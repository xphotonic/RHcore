name: pack-and-sign-arb-artifact

on:
  workflow_dispatch:
    inputs:
      flint_commit:
        description: "40-hex FLINT commit from https://github.com/flintlib/flint"
        required: false
        default: "b574c48f46ca505d6d48dd843c0fe95e1199ecdc"
  push:
    branches: [main]
    paths:
      - "data/li_n_intervals.csv"
      - "tools/generate_spectral_eigs.py"
      - "tools/build_ro_crate.py"
      - "tools/verify_ro_crate_checksums.py"
      - ".github/workflows/pack_and_sign_arb_artifact.yml"
      - "lakefile.lean"
      - "lean-toolchain"
      - "RhCore/**"
  pull_request:
    paths:
      - "data/li_n_intervals.csv"
      - "tools/generate_spectral_eigs.py"
      - "tools/build_ro_crate.py"
      - "tools/verify_ro_crate_checksums.py"
      - ".github/workflows/pack_and_sign_arb_artifact.yml"
      - "lakefile.lean"
      - "lean-toolchain"
      - "RhCore/**"

permissions:
  contents: write
  id-token: write

jobs:
  pack-and-sign:
    runs-on: ubuntu-latest
    env:
      DEFAULT_FLINT_COMMIT: "b574c48f46ca505d6d48dd843c0fe95e1199ecdc"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture commits
        shell: bash
        run: |
          set -euo pipefail
          echo "GIT_COMMIT=$(git rev-parse --verify HEAD)" >> "$GITHUB_ENV"
          FLINT_COMMIT="${{ github.event.inputs.flint_commit }}"
          if [ -z "$FLINT_COMMIT" ]; then FLINT_COMMIT="$DEFAULT_FLINT_COMMIT"; fi
          if ! printf '%s' "$FLINT_COMMIT" | grep -qE '^[0-9a-f]{40}$'; then
            echo "invalid FLINT_COMMIT: $FLINT_COMMIT" >&2
            exit 1
          fi
          git ls-remote https://github.com/flintlib/flint.git HEAD >/dev/null
          echo "FLINT_COMMIT=$FLINT_COMMIT" >> "$GITHUB_ENV"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential automake autoconf libtool git python3 jq wget \
            pkg-config ca-certificates libgmp-dev libmpfr-dev

      - name: Build FLINT/Arb at pinned commit
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/flintlib/flint.git flint-src
          cd flint-src
          git checkout "$FLINT_COMMIT"
          if [ -x ./bootstrap.sh ]; then ./bootstrap.sh; fi
          ./configure --prefix="$PWD/../flint-install"
          make -j"$(nproc)"
          make install
          cd ..
          test -d flint-install

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: true
          use-mathlib-cache: true
          build: false

      - name: Generate eig artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python3 tools/generate_spectral_eigs.py \
            --input data/li_n_intervals.csv \
            --out output/generated_eigs.lean
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          rows = []
          with Path("data/li_n_intervals.csv").open(newline="", encoding="utf-8-sig") as handle:
              for row in csv.DictReader(handle):
                  rows.append({
                      "n": int(row["n"]),
                      "mid": row.get("mid", row.get("midpoint")),
                      "rad": row.get("rad", row.get("radius")),
                  })
          payload = {
              "source": "data/li_n_intervals.csv",
              "generator": "tools/generate_spectral_eigs.py",
              "rows": rows,
          }
          Path("output/generated_eigs.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
          PY
          cp output/generated_eigs.lean RhCore/Spectral/GeneratedEigs.lean
          lake build RhCore.Spectral.GeneratedEigs

      - name: Build RO-Crate directory
        shell: bash
        run: |
          set -euo pipefail
          RO_DIR="rocrate-${GIT_COMMIT}"
          mkdir -p "$RO_DIR/data"
          cp output/generated_eigs.json "$RO_DIR/data/generated_eigs.json"
          cp output/generated_eigs.lean "$RO_DIR/data/generated_eigs.lean"
          cp data/li_n_intervals.csv "$RO_DIR/data/li_n_intervals.csv"
          cp lean-toolchain "$RO_DIR/data/lean-toolchain"
          cp lakefile.lean "$RO_DIR/data/lakefile.lean"
          python3 tools/build_ro_crate.py \
            --artifact "$RO_DIR/data/generated_eigs.json" \
            --artifact "$RO_DIR/data/generated_eigs.lean" \
            --artifact "$RO_DIR/data/li_n_intervals.csv" \
            --artifact "$RO_DIR/data/lean-toolchain" \
            --artifact "$RO_DIR/data/lakefile.lean" \
            --out "$RO_DIR/ro-crate-metadata.json" \
            --attestation "$RO_DIR/generated_eigs.attestation.json" \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit-sha "$GIT_COMMIT" \
            --provenance "{\"arb_compat_source\":\"flint\",\"flint_repo\":\"https://github.com/flintlib/flint\",\"flint_commit\":\"$FLINT_COMMIT\",\"source\":\"data/li_n_intervals.csv\"}"
          python3 tools/verify_ro_crate_checksums.py --crate "$RO_DIR/ro-crate-metadata.json" --root "$RO_DIR/data"
          tar -C "$RO_DIR" -czf "rocrate-${GIT_COMMIT}.tar.gz" .
          sha256sum "rocrate-${GIT_COMMIT}.tar.gz" > "rocrate-${GIT_COMMIT}.tar.gz.sha256"
          echo "RO_DIR=$RO_DIR" >> "$GITHUB_ENV"
          echo "RO_CRATE=rocrate-${GIT_COMMIT}.tar.gz" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign RO-Crate keylessly
        if: github.event_name != 'pull_request'
        run: |
          cosign sign-blob --yes \
            --bundle "${RO_CRATE}.sigstore.json" \
            "$RO_CRATE"

      - name: Verify RO-Crate signature
        if: github.event_name != 'pull_request'
        run: |
          cosign verify-blob \
            --bundle "${RO_CRATE}.sigstore.json" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$RO_CRATE"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: arb-rocrate-${{ github.sha }}
          path: |
            ${{ env.RO_CRATE }}
            ${{ env.RO_CRATE }}.sha256
            ${{ env.RO_CRATE }}.sigstore.json

      - name: Create release with signed RO-Crate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prebuilt-${{ github.sha }}
          name: prebuilt-${{ github.sha }}
          files: |
            ${{ env.RO_CRATE }}
            ${{ env.RO_CRATE }}.sha256
            ${{ env.RO_CRATE }}.sigstore.json
