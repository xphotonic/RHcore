name: spectral-benchmarks

on:
  push:
    paths:
      - "tools/spectral_benchmark_cards.py"
      - "data/spectral/operator_families.json"
      - ".github/workflows/spectral_benchmarks.yml"
  pull_request:
    paths:
      - "tools/spectral_benchmark_cards.py"
      - "data/spectral/operator_families.json"
      - ".github/workflows/spectral_benchmarks.yml"
  workflow_dispatch:

jobs:
  benchmark-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run known-spectrum benchmark cards
        run: |
          python tools/spectral_benchmark_cards.py \
            --json outputs/spectral_benchmark_cards.json \
            --csv outputs/spectral_benchmark_cards.csv \
            --strict

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spectral-benchmark-cards
          path: |
            outputs/spectral_benchmark_cards.json
            outputs/spectral_benchmark_cards.csv
