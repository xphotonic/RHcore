name: energy-ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      trace_path:
        description: "CSV trace path"
        required: false
        default: "traces/run1.csv"
      block_size:
        description: "Moving-block bootstrap size"
        required: false
        default: "5"

permissions:
  contents: read
  id-token: write

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis deps
        run: |
          python -m pip install --upgrade pip
          pip install papermill ipykernel numpy pandas scipy nbformat

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Run Landauer notebook
        run: |
          TRACE_PATH="${{ github.event.inputs.trace_path }}"
          BLOCK_SIZE="${{ github.event.inputs.block_size }}"
          if [ -z "$TRACE_PATH" ]; then TRACE_PATH="traces/run1.csv"; fi
          if [ -z "$BLOCK_SIZE" ]; then BLOCK_SIZE="5"; fi
          python scripts/run_landauer_notebook.py \
            --trace-path "$TRACE_PATH" \
            --block-size "$BLOCK_SIZE" \
            --output-notebook outputs/landauer.executed.ipynb

      - name: Sign summary artifact
        run: |
          cosign sign-blob --yes \
            --bundle outputs/energy-per-erasure.csv.bundle.json \
            --output-signature outputs/energy-per-erasure.csv.sig \
            --output-certificate outputs/energy-per-erasure.csv.pem \
            outputs/energy-per-erasure.csv

      - uses: actions/upload-artifact@v4
        with:
          name: energy-artifact
          path: |
            outputs/energy-per-erasure.csv
            outputs/cycle-energy.csv
            outputs/uncertainty-components.csv
            outputs/landauer.executed.ipynb
            outputs/energy-per-erasure.csv.sig
            outputs/energy-per-erasure.csv.pem
            outputs/energy-per-erasure.csv.bundle.json
